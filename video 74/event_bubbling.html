<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 2px solid rgb(218, 49, 49);
            width: 99vw;
            height: 90vh;
            justify-content: center;
            align-items: center;
        }

        .child {
            border: 2px solid black;
            width: 33px;
            height: 52px;
            margin: 0 auto;
        }

        .childcontainer{
            width: 222px;height: 222px;
            border: 2px solid red;
             margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                iam child
            </div>
        </section>
    </div>

    <script>

        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("child was clicked ")
        })


        document.querySelector(".childcontainer").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("childcontainer was clicked ")
        })


        document.querySelector(".container").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("container was clicked ")
        })

        setInterval(() => {
            document.querySelector(".child").style.backgroundColor = getRandomColor()
        }, 3000)

        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1}, ${val2}, ${val3})`
        }


        let a = setTimeout(() => {
            document.querySelector(".childcontainer").style.background= getRandomColor()
        }, 5000);



    </script>
</body>

</html>
