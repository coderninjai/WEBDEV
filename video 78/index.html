<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hacking Simulator (simple)</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      background:#0b3;            /* green background */
      color:#fff;
      font-family: "Courier New", monospace;
      padding:20px;
      font-size:18px;
      line-height:1.6;
    }
    .line{ white-space:pre; }
    .dots{ display:inline-block; width:3ch; text-align:left; }
  </style>
</head>
<body>
  <div id="output"></div>

  <script>
    const messages = [
      "Initializing Hacking...",
      "Reading your Files...",
      "Password files Detected...",
      "Sending all passwords and personal files to server...",
      "Cleaning up..."
    ];

    const output = document.getElementById('output');

    const wait = ms => new Promise(res => setTimeout(res, ms));
    const randomMs = () => 1000 * (1 + 6 * Math.random()); // 1 - 7 seconds

  \
    (async function run(){
      for (const text of messages) {
        const line = document.createElement('div');
        line.className = 'line';
        const textNode = document.createTextNode(text.replace(/\.*$/, '')); // keep base text
        const dotSpan = document.createElement('span');
        dotSpan.className = 'dots';
        dotSpan.textContent = '';
        line.appendChild(textNode);
        line.appendChild(dotSpan);
        output.appendChild(line);

        // animate dots: '', '.', '..', '...' loop
        const frames = ['', '.', '..', '...'];
        let i = 0;
        const iv = setInterval(() => {
          dotSpan.textContent = frames[i % frames.length];
          i++;
        }, 400);

        await wait(randomMs()); // wait between 1-7s

        clearInterval(iv);
        dotSpan.textContent = '...'; // leave final state
      }
    })();
  </script>
</body>
</html>
